; PlatformIO Project Configuration File
; ESP32-S3 integrated smart charging dock configuration
; EAT: DS18B20, VL53L1X ToF, TFT
; ST7789, buzzer and LEDs
; Contact switch, emergency stop and relay integration
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Hardware configuration: 8 MB Quad Flash and 8 MB Octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.boot = qio
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 8MB
build_flags =
  -DBOARD_HAS_PSRAM
lib_deps =
  ; VL53L1X time-of-flight distance sensor
  sparkfun/SparkFun VL53L1X 4m Laser Distance Sensor@^1.2.12
  ; DS18B20 library dependencies retained from the original configuration
  paulstoffregen/OneWire
  milesburton/DallasTemperature
  ; ST7789 TFT display
  adafruit/Adafruit GFX Library
  adafruit/Adafruit ST7735 and ST7789 Library
